<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constelação OC - Mapa & Lore</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Vis.js Network para o Mapa de Nós -->
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body { background-color: #0b0f19; color: #e2e8f0; font-family: sans-serif; margin: 0; overflow: hidden; }
    #mynetwork { width: 100vw; height: 100vh; background-color: #0b0f19; position: absolute; top: 0; left: 0; z-index: 1; }
    header { position: relative; z-index: 10; }
    aside, .modal-overlay { position: relative; z-index: 50; }
  </style>
</head>
<body class="flex flex-col h-screen">

  <!-- Header Superior -->
  <header class="flex justify-between items-center p-4 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">
        ✨ Constelação
      </h1>
      <span class="text-xs px-2 py-1 bg-slate-800 text-slate-400 rounded">V2.2</span>
    </div>
    
    <div class="flex items-center space-x-2">
      <button onclick="openNodeModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition cursor-pointer">
        + Novo Personagem
      </button>
      <button onclick="toggleChat()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg transition cursor-pointer">
        💬 Chat IA
      </button>
      <button onclick="openSettingsModal()" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg transition cursor-pointer" title="Configurações">
        ⚙️
      </button>
    </div>
  </header>

  <!-- Área do Mapa -->
  <main class="flex-1 relative">
    <div id="mynetwork"></div>
  </main>

  <!-- Modal de Configurações -->
  <div id="modal-settings" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-xl p-6 shadow-2xl">
      <h2 class="text-lg font-bold text-slate-100 mb-4">⚙️ Configurações</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Chave da API Gemini (API Key)</label>
          <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Seu Nome</label>
          <input type="text" id="input-user-name" placeholder="Ex: André" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nome da sua IA</label>
          <input type="text" id="input-ai-name" placeholder="Ex: Astra" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeSettingsModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm cursor-pointer">Cancelar</button>
        <button onclick="saveSettings()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium cursor-pointer">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Drawer do Chat da IA -->
  <aside id="chat-drawer" class="hidden fixed right-0 top-0 bottom-0 w-full max-w-md bg-slate-900 border-l border-slate-800 flex flex-col shadow-2xl">
    <div class="p-4 border-b border-slate-800 flex justify-between items-center">
      <h3 id="chat-header-title" class="font-bold text-slate-200">💬 Assistente de Lore</h3>
      <button onclick="toggleChat()" class="text-slate-400 hover:text-slate-200 cursor-pointer text-lg font-bold">✕</button>
    </div>
    
    <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm"></div>

    <div class="p-3 border-t border-slate-800 flex space-x-2">
      <input type="text" id="chat-input" placeholder="Pergunte sobre os OCs..." onkeydown="if(event.key === 'Enter') sendMessage()" class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none">
      <button onclick="sendMessage()" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-sm font-medium cursor-pointer">Enviar</button>
    </div>
  </aside>

  <!-- Modal Adicionar Personagem -->
  <div id="modal-node" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-xl p-6 shadow-2xl">
      <h2 class="text-lg font-bold text-slate-100 mb-4">Adicionar Personagem</h2>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nome do Personagem</label>
          <input type="text" id="node-label" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Universo / Facção</label>
          <input type="text" id="node-group" placeholder="Ex: Cyberpunk, Fantasia..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
        </div>
      </div>

      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeNodeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-sm cursor-pointer">Cancelar</button>
        <button onclick="saveNode()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium cursor-pointer">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    let network = null;
    let nodes = new vis.DataSet([]);
    let edges = new vis.DataSet([]);

    let config = {
      apiKey: localStorage.getItem('gemini_api_key') || '',
      userName: localStorage.getItem('user_name') || 'André',
      aiName: localStorage.getItem('ai_name') || 'Astra'
    };

    let chatHistory = JSON.parse(localStorage.getItem('stellar_chat_history') || '[]');

    window.addEventListener('load', () => {
      document.getElementById('chat-header-title').innerText = `💬 ${config.aiName}`;
      initNetwork();
      loadStoredData();
      renderChatMessages();
    });

    function initNetwork() {
      const container = document.getElementById('mynetwork');
      const data = { nodes: nodes, edges: edges };
      const options = {
        nodes: { shape: 'dot', size: 16, font: { color: '#e2e8f0', size: 14 } },
        physics: { stabilization: true }
      };
      network = new vis.Network(container, data, options);
    }

    function openSettingsModal() {
      document.getElementById('input-api-key').value = config.apiKey;
      document.getElementById('input-user-name').value = config.userName;
      document.getElementById('input-ai-name').value = config.aiName;
      document.getElementById('modal-settings').classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('modal-settings').classList.add('hidden');
    }

    function saveSettings() {
      config.apiKey = document.getElementById('input-api-key').value.trim();
      config.userName = document.getElementById('input-user-name').value.trim() || 'André';
      config.aiName = document.getElementById('input-ai-name').value.trim() || 'Astra';

      localStorage.setItem('gemini_api_key', config.apiKey);
      localStorage.setItem('user_name', config.userName);
      localStorage.setItem('ai_name', config.aiName);

      document.getElementById('chat-header-title').innerText = `💬 ${config.aiName}`;
      closeSettingsModal();
      alert('Configurações salvas!');
    }

    function openNodeModal() {
      document.getElementById('node-label').value = '';
      document.getElementById('node-group').value = '';
      document.getElementById('modal-node').classList.remove('hidden');
    }

    function closeNodeModal() {
      document.getElementById('modal-node').classList.add('hidden');
    }

    function saveNode() {
      const label = document.getElementById('node-label').value.trim();
      const group = document.getElementById('node-group').value.trim();
      if (label) {
        nodes.add({ id: Date.now(), label: label, group: group });
        saveData();
        closeNodeModal();
      }
    }

    function toggleChat() {
      const drawer = document.getElementById('chat-drawer');
      drawer.classList.toggle('hidden');
    }

    function saveData() {
      localStorage.setItem('stellar_nodes', JSON.stringify(nodes.get()));
      localStorage.setItem('stellar_edges', JSON.stringify(edges.get()));
    }

    function loadStoredData() {
      const savedNodes = JSON.parse(localStorage.getItem('stellar_nodes') || '[]');
      const savedEdges = JSON.parse(localStorage.getItem('stellar_edges') || '[]');
      if (savedNodes.length > 0) nodes.add(savedNodes);
      if (savedEdges.length > 0) edges.add(savedEdges);
    }

    function renderChatMessages() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      chatHistory.forEach(msg => {
        const div = document.createElement('div');
        div.className = msg.role === 'user' 
          ? 'p-2.5 bg-indigo-950/60 border border-indigo-800/40 rounded-lg ml-6 text-indigo-200' 
          : 'p-2.5 bg-slate-800 border border-slate-700 rounded-lg mr-6 text-slate-300';
        div.innerHTML = `<strong>${msg.role === 'user' ? config.userName : config.aiName}:</strong> ${msg.text}`;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (!config.apiKey) {
        alert('Adicione sua Chave da API do Gemini nas configurações (⚙️) primeiro.');
        openSettingsModal();
        return;
      }

      chatHistory.push({ role: 'user', text: text });
      input.value = '';
      renderChatMessages();

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${config.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Seu nome é ${config.aiName}. Você é uma assistente criativa de lore e OCs. Trate o usuário pelo nome dele, que é ${config.userName}. Responda à mensagem: ${text}`
              }]
            }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message || 'Erro na API');
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta da IA.';
        
        chatHistory.push({ role: 'ai', text: reply });
        localStorage.setItem('stellar_chat_history', JSON.stringify(chatHistory));
        renderChatMessages();
      } catch (e) {
        chatHistory.push({ role: 'ai', text: 'Erro ao conectar à API: ' + e.message });
        renderChatMessages();
      }
    }
  </script>
</body>
</html>
