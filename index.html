<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Constelação OC - Mapa & Lore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }

    #app-container { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
    header { height: 60px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 20; }
    .title { font-size: 1.1rem; font-weight: 700; background: linear-gradient(90deg, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-buttons { display: flex; gap: 8px; }
    
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    button:active { transform: scale(0.96); }
    button.btn-primary { background: #4f46e5; border-color: #6366f1; color: #fff; }

    main { flex: 1; position: relative; width: 100%; height: calc(100% - 60px); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #0b0f19; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.hidden { display: none !important; }
    .modal-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7); }
    .modal-card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #f8fafc; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #6366f1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    aside#chat-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 380px; background: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 90; transition: transform 0.3s ease; }
    aside#chat-drawer.hidden { transform: translateX(100%); }
    .chat-header { height: 60px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 700; }
    .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 85%; line-height: 1.4; word-break: break-word; }
    .chat-msg.user { background: #312e81; border: 1px solid #4338ca; color: #e0e7ff; align-self: flex-end; }
    .chat-msg.ai { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; align-self: flex-start; }
    .chat-input-area { padding: 12px; border-top: 1px solid #1e293b; display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="title">✨ Constelação</div>
      <div class="nav-buttons">
        <button type="button" class="btn-primary" onclick="window.openModal('modal-node')">+ Personagem</button>
        <button type="button" onclick="window.toggleChat()">💬 Chat IA</button>
        <button type="button" onclick="window.openModal('modal-settings')">⚙️</button>
      </div>
    </header>

    <main>
      <canvas id="mapCanvas"></canvas>
    </main>
  </div>

  <!-- Modal Configurações -->
  <div id="modal-settings" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>⚙️ Configurações</h2>
      <div class="form-group">
        <label>Chave da API Gemini</label>
        <input type="password" id="cfg-key" placeholder="AIzaSy...">
      </div>
      <div class="form-group">
        <label>Modelo Gemini</label>
        <input type="text" id="cfg-model" placeholder="Ex: gemini-2.5-flash">
      </div>
      <div class="form-group">
        <label>Seu Nome</label>
        <input type="text" id="cfg-user" placeholder="Ex: André">
      </div>
      <div class="form-group">
        <label>Nome da IA</label>
        <input type="text" id="cfg-ai" placeholder="Ex: Astra">
      </div>
      <div class="modal-actions">
        <button type="button" onclick="window.closeModal('modal-settings')">Cancelar</button>
        <button type="button" class="btn-primary" onclick="window.saveSettings()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal Adicionar Personagem -->
  <div id="modal-node" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Adicionar Personagem</h2>
      <div class="form-group">
        <label>Nome do Personagem</label>
        <input type="text" id="node-name" placeholder="Ex: Yas">
      </div>
      <div class="form-group">
        <label>Universo / Facção</label>
        <input type="text" id="node-group" placeholder="Ex: Cyberpunk, Fantasia...">
      </div>
      <div class="modal-actions">
        <button type="button" onclick="window.closeModal('modal-node')">Cancelar</button>
        <button type="button" class="btn-primary" onclick="window.createNode()">Adicionar</button>
      </div>
    </div>
  </div>

  <!-- Drawer do Chat -->
  <aside id="chat-drawer" class="hidden">
    <div class="chat-header">
      <span id="chat-title">💬 Chat IA</span>
      <button type="button" onclick="window.toggleChat()" style="border:none; background:transparent; font-size:1.2rem; color:#fff;">✕</button>
    </div>
    <div class="chat-body" id="chat-box"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Escreva aqui..." onkeydown="if(event.key === 'Enter') window.sendChatMessage()">
      <button type="button" class="btn-primary" onclick="window.sendChatMessage()">Enviar</button>
    </div>
  </aside>

  <script>
    // --- ESTADO & CONFIGURAÇÃO ---
    let config = {
      apiKey: (localStorage.getItem('c_key') || '').trim(),
      model: (localStorage.getItem('c_model') || 'gemini-2.5-flash').trim(),
      userName: (localStorage.getItem('c_user') || 'André').trim(),
      aiName: (localStorage.getItem('c_ai') || 'Astra').trim()
    };

    let nodes = JSON.parse(localStorage.getItem('c_nodes') || '[]');
    let chatHistory = JSON.parse(localStorage.getItem('c_chat') || '[]');

    if (nodes.length === 0) {
      nodes.push({ id: 1, name: 'Protagonista', group: 'Geral', x: window.innerWidth / 2, y: window.innerHeight / 2 });
      localStorage.setItem('c_nodes', JSON.stringify(nodes));
    }

    // --- CANVAS ENGINE (MAPA) ---
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let draggedNode = null;
    let isDragging = false;
    let dragOffset = { x: 0, y: 0 };

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      drawMap();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1.5;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.stroke();
        }
      }

      nodes.forEach(node => {
        ctx.beginPath();
        ctx.arc(node.x, node.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = '#6366f1';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#818cf8';
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(node.name, node.x, node.y + 32);
      });
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onPointerDown(e) {
      const pos = getPos(e);
      draggedNode = nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 25);
      if (draggedNode) {
        isDragging = true;
        dragOffset.x = pos.x - draggedNode.x;
        dragOffset.y = pos.y - draggedNode.y;
      }
    }

    function onPointerMove(e) {
      if (isDragging && draggedNode) {
        const pos = getPos(e);
        draggedNode.x = pos.x - dragOffset.x;
        draggedNode.y = pos.y - dragOffset.y;
        drawMap();
      }
    }

    function onPointerUp() {
      if (isDragging) {
        isDragging = false;
        draggedNode = null;
        localStorage.setItem('c_nodes', JSON.stringify(nodes));
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    canvas.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // --- FUNÇÕES GLOBAIS SEGURAS ---
    window.openModal = function(id) {
      if (id === 'modal-settings') {
        document.getElementById('cfg-key').value = config.apiKey;
        document.getElementById('cfg-model').value = config.model;
        document.getElementById('cfg-user').value = config.userName;
        document.getElementById('cfg-ai').value = config.aiName;
      }
      document.getElementById(id).classList.remove('hidden');
    }

    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    }

    window.saveSettings = function() {
      config.apiKey = document.getElementById('cfg-key').value.trim();
      config.model = document.getElementById('cfg-model').value.trim() || 'gemini-2.5-flash';
      config.userName = document.getElementById('cfg-user').value.trim() || 'André';
      config.aiName = document.getElementById('cfg-ai').value.trim() || 'Astra';

      localStorage.setItem('c_key', config.apiKey);
      localStorage.setItem('c_model', config.model);
      localStorage.setItem('c_user', config.userName);
      localStorage.setItem('c_ai', config.aiName);

      document.getElementById('chat-title').innerText = `💬 ${config.aiName}`;
      window.closeModal('modal-settings');
      alert('Configurações salvas com sucesso!');
    }

    window.createNode = function() {
      const nameInput = document.getElementById('node-name');
      const groupInput = document.getElementById('node-group');
      const name = nameInput.value.trim();
      const group = groupInput.value.trim() || 'Geral';
      
      if (!name) return;

      const newNode = {
        id: Date.now(),
        name: name,
        group: group,
        x: canvas.width / 2 + (Math.random() * 80 - 40),
        y: canvas.height / 2 + (Math.random() * 80 - 40)
      };

      nodes.push(newNode);
      localStorage.setItem('c_nodes', JSON.stringify(nodes));
      drawMap();
      
      nameInput.value = '';
      groupInput.value = '';
      window.closeModal('modal-node');
    }

    window.toggleChat = function() {
      const drawer = document.getElementById('chat-drawer');
      drawer.classList.toggle('hidden');
    }

    function renderChat() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      chatHistory.forEach(msg => {
        const div = document.createElement('div');
        div.className = `chat-msg ${msg.role}`;
        div.innerHTML = `<strong>${msg.role === 'user' ? config.userName : config.aiName}:</strong> ${msg.text}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    window.sendChatMessage = async function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (!config.apiKey) {
        alert('Por favor, adicione sua Chave de API nas configurações (⚙️) antes de conversar.');
        window.openModal('modal-settings');
        return;
      }

      chatHistory.push({ role: 'user', text: text });
      input.value = '';
      
      chatHistory.push({ role: 'ai', text: '<i>Pensando...</i>' });
      renderChat();

      try {
        const activeModel = config.model || 'gemini-2.5-flash';
        const cleanKey = encodeURIComponent(config.apiKey);
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${cleanKey}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Você é ${config.aiName}, uma assistente criativa de lore e OCs. Responda para ${config.userName}: ${text}`
              }]
            }]
          })
        });

        chatHistory.pop(); // Remove "Pensando..."

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `Erro na resposta do servidor (HTTP ${response.status})`);
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (reply) {
          chatHistory.push({ role: 'ai', text: reply });
        } else {
          chatHistory.push({ role: 'ai', text: 'Nenhuma resposta retornada pela IA.' });
        }
        
        localStorage.setItem('c_chat', JSON.stringify(chatHistory));
        renderChat();
      } catch (err) {
        if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].text === '<i>Pensando...</i>') {
          chatHistory.pop();
        }
        
        let msgErro = err.message;
        if (msgErro.includes('Failed to fetch')) {
          msgErro = 'Falha na conexão (Failed to fetch). Verifique se o nome do modelo nas Configurações (⚙️) está correto ou se a chave de API tem espaços.';
        }
        
        chatHistory.push({ role: 'ai', text: 'Erro: ' + msgErro });
        renderChat();
      }
    }

    // --- INICIALIZAÇÃO ---
    window.onload = () => {
      document.getElementById('chat-title').innerText = `💬 ${config.aiName}`;
      resizeCanvas();
      renderChat();
    };
  </script>
</body>
</html>
