<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Constelação OC - Mapa & Lore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background-color: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; height: 100vh; width: 100vw; }

    #app-container { display: flex; flex-direction: column; height: 100%; width: 100%; position: relative; }
    header { height: 60px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 20; }
    .title { font-size: 1.1rem; font-weight: 700; background: linear-gradient(90deg, #c084fc, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-buttons { display: flex; gap: 8px; }
    
    button { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    button:active { transform: scale(0.96); }
    button.btn-primary { background: #4f46e5; border-color: #6366f1; color: #fff; }

    main { flex: 1; position: relative; width: 100%; height: calc(100% - 60px); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; background: #0b0f19; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.hidden { display: none !important; }
    .modal-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7); max-height: 90vh; overflow-y: auto; }
    .modal-card h2 { font-size: 1.1rem; margin-bottom: 16px; color: #f8fafc; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; font-weight: 600; margin-bottom: 4px; text-transform: uppercase; }
    .form-group input, .form-group textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 10px; border-radius: 6px; font-size: 0.9rem; outline: none; }
    .form-group input:focus, .form-group textarea:focus { border-color: #6366f1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

    aside#chat-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 100%; max-width: 380px; background: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 90; transition: transform 0.3s ease; }
    aside#chat-drawer.hidden { transform: translateX(100%); }
    .chat-header { height: 60px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 700; }
    .chat-body { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { padding: 10px 12px; border-radius: 8px; font-size: 0.85rem; max-width: 85%; line-height: 1.4; word-break: break-word; }
    .chat-msg.user { background: #312e81; border: 1px solid #4338ca; color: #e0e7ff; align-self: flex-end; }
    .chat-msg.ai { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; align-self: flex-start; }
    .chat-input-area { padding: 12px; border-top: 1px solid #1e293b; display: flex; gap: 8px; }
    .chat-input-area input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <div class="title">✨ Constelação</div>
      <div class="nav-buttons">
        <button type="button" class="btn-primary" onclick="window.openModal('modal-node')">+ Personagem</button>
        <button type="button" onclick="window.toggleChat()">💬 Chat IA</button>
        <button type="button" onclick="window.openModal('modal-settings')">⚙️</button>
      </div>
    </header>

    <main>
      <canvas id="mapCanvas"></canvas>
    </main>
  </div>

  <!-- Modal Configurações -->
  <div id="modal-settings" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>⚙️ Configurações</h2>
      <div class="form-group">
        <label>Chave da API Gemini</label>
        <input type="password" id="cfg-key" placeholder="AIzaSy...">
      </div>
      <div class="form-group">
        <label>Modelo Gemini</label>
        <input type="text" id="cfg-model" placeholder="Ex: gemini-2.5-flash">
      </div>
      <div class="form-group">
        <label>Seu Nome</label>
        <input type="text" id="cfg-user" placeholder="Ex: André">
      </div>
      <div class="form-group">
        <label>Nome da IA</label>
        <input type="text" id="cfg-ai" placeholder="Ex: Astra">
      </div>
      <div class="modal-actions">
        <button type="button" onclick="window.closeModal('modal-settings')">Cancelar</button>
        <button type="button" class="btn-primary" onclick="window.saveSettings()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Modal Adicionar Personagem -->
  <div id="modal-node" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>Adicionar Personagem</h2>
      <div class="form-group">
        <label>Nome do Personagem</label>
        <input type="text" id="node-name" placeholder="Ex: Satoru, Luffy, OC Próprio...">
      </div>
      <div class="form-group">
        <label>Universo / Facção (Qualquer mundo)</label>
        <input type="text" id="node-group" placeholder="Ex: Jujutsu Kaisen, Star Wars, Mundo Original...">
      </div>
      <div class="modal-actions">
        <button type="button" onclick="window.closeModal('modal-node')">Cancelar</button>
        <button type="button" class="btn-primary" onclick="window.createNode()">Adicionar</button>
      </div>
    </div>
  </div>

  <!-- Modal Detalhes / Atributos Dinâmicos Gerados por IA -->
  <div id="modal-details" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 id="details-title">Ficha do Personagem</h2>
      <input type="hidden" id="details-id">
      
      <div class="form-group">
        <label>Universo / Facção</label>
        <input type="text" id="details-group" readonly style="opacity: 0.7;">
      </div>

      <div id="dynamic-fields-container">
        <!-- Campos gerados dinamicamente pela IA -->
      </div>

      <div class="form-group">
        <label>Adicionar Atributo Extra Manual</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="new-attr-key" placeholder="Nome do atributo..." style="flex:1;">
          <button type="button" onclick="window.addCustomAttribute()" style="background:#4f46e5; color:#fff; border:none; padding:0 12px; border-radius:6px; font-weight:bold;">+</button>
        </div>
      </div>

      <div class="form-group">
        <label>Notas Gerais / História</label>
        <textarea id="details-notes" rows="3" placeholder="História, personalidade..."></textarea>
      </div>

      <div class="modal-actions">
        <button type="button" style="background:#ef4444; border-color:#dc2626;" onclick="window.deleteNode()">Excluir</button>
        <button type="button" onclick="window.closeModal('modal-details')">Cancelar</button>
        <button type="button" class="btn-primary" onclick="window.saveNodeDetails()">Salvar Ficha</button>
      </div>
    </div>
  </div>

  <!-- Drawer do Chat -->
  <aside id="chat-drawer" class="hidden">
    <div class="chat-header">
      <span id="chat-title">💬 Chat IA</span>
      <button type="button" onclick="window.toggleChat()" style="border:none; background:transparent; font-size:1.2rem; color:#fff;">✕</button>
    </div>
    <div class="chat-body" id="chat-box"></div>
    <div class="chat-input-area">
      <input type="text" id="chat-input" placeholder="Escreva aqui..." onkeydown="if(event.key === 'Enter') window.sendChatMessage()">
      <button type="button" class="btn-primary" onclick="window.sendChatMessage()">Enviar</button>
    </div>
  </aside>

  <script>
    let config = {
      apiKey: (localStorage.getItem('c_key') || '').trim(),
      model: (localStorage.getItem('c_model') || 'gemini-2.5-flash').trim(),
      userName: (localStorage.getItem('c_user') || 'André').trim(),
      aiName: (localStorage.getItem('c_ai') || 'Astra').trim()
    };

    let nodes = JSON.parse(localStorage.getItem('c_nodes') || '[]');
    let chatHistory = JSON.parse(localStorage.getItem('c_chat') || '[]');

    if (nodes.length === 0) {
      nodes.push({ 
        id: 1, 
        name: 'Protagonista', 
        group: 'Geral', 
        x: window.innerWidth / 2, 
        y: window.innerHeight / 2,
        attributes: { 'Poderes / Habilidades': 'Nenhum', 'Equipamento': 'Padrão' },
        notes: 'Exemplo inicial.'
      });
      localStorage.setItem('c_nodes', JSON.stringify(nodes));
    }

    const groupColors = {};
    const palette = ['#6366f1', '#ec4899', '#10b981', '#f59e0b', '#8b5cf6', '#06b6d4', '#f43f5e'];

    function getGroupColor(groupName) {
      const key = (groupName || 'Geral').trim().toLowerCase();
      if (!groupColors[key]) {
        const index = Object.keys(groupColors).length % palette.length;
        groupColors[key] = palette[index];
      }
      return groupColors[key];
    }

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let draggedNode = null;
    let isDragging = false;
    let clickStartPos = { x: 0, y: 0 };

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      drawMap();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const sameGroup = (nodes[i].group || '').trim().toLowerCase() === (nodes[j].group || '').trim().toLowerCase();
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = sameGroup ? '#475569' : '#1e293b';
          ctx.lineWidth = sameGroup ? 2 : 1;
          ctx.stroke();
        }
      }

      nodes.forEach(node => {
        const color = getGroupColor(node.group);

        ctx.beginPath();
        ctx.arc(node.x, node.y, 20, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#f8fafc';
        ctx.stroke();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(node.name, node.x, node.y + 35);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '10px sans-serif';
        ctx.fillText(`[${node.group || 'Geral'}]`, node.x, node.y + 48);
      });
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function onPointerDown(e) {
      const pos = getPos(e);
      clickStartPos = pos;
      draggedNode = nodes.find(n => Math.hypot(n.x - pos.x, n.y - pos.y) < 25);
      if (draggedNode) {
        isDragging = true;
      }
    }

    function onPointerMove(e) {
      if (isDragging && draggedNode) {
        const pos = getPos(e);
        draggedNode.x = pos.x;
        draggedNode.y = pos.y;
        drawMap();
      }
    }

    function onPointerUp(e) {
      if (isDragging && draggedNode) {
        const pos = getPos(e);
        const distMoved = Math.hypot(pos.x - clickStartPos.x, pos.y - clickStartPos.y);
        
        if (distMoved < 5) {
          window.openDetailsModal(draggedNode);
        }

        isDragging = false;
        draggedNode = null;
        localStorage.setItem('c_nodes', JSON.stringify(nodes));
      }
    }

    canvas.addEventListener('mousedown', onPointerDown);
    canvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    canvas.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    window.openModal = function(id) {
      if (id === 'modal-settings') {
        document.getElementById('cfg-key').value = config.apiKey;
        document.getElementById('cfg-model').value = config.model;
        document.getElementById('cfg-user').value = config.userName;
        document.getElementById('cfg-ai').value = config.aiName;
      }
      document.getElementById(id).classList.remove('hidden');
    }

    window.closeModal = function(id) {
      document.getElementById(id).classList.add('hidden');
    }

    // Função que pede para a IA pesquisar/gerar os atributos padrão do universo informado
    async function fetchAiUniverseFields(universeName) {
      if (!config.apiKey) return ['Poderes', 'Equipamento', 'Origem'];
      
      try {
        const activeModel = config.model || 'gemini-2.5-flash';
        const cleanKey = encodeURIComponent(config.apiKey);
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${cleanKey}`;

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Para o universo de ficção/obra "${universeName}", liste exatamente 4 atributos ou características essenciais que definem um personagem ou OC nesse mundo (ex: armas, poderes, clã, raça, gema, etc). Retorne APENAS os nomes dos 4 atributos separados por vírgula, sem numeração e sem texto adicional.`
              }]
            }]
          })
        });

        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (text) {
          return text.split(',').map(s => s.trim()).filter(Boolean);
        }
      } catch (e) {
        console.error('Erro ao buscar campos da IA:', e);
      }
      return ['Poderes / Habilidades', 'Equipamento / Arma', 'Origem / Facção', 'Cargo / Classe'];
    }

    window.openDetailsModal = async function(node) {
      document.getElementById('details-id').value = node.id;
      document.getElementById('details-title').innerText = `✨ ${node.name}`;
      document.getElementById('details-group').value = node.group || 'Geral';
      document.getElementById('details-notes').value = node.notes || '';

      const container = document.getElementById('dynamic-fields-container');
      container.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">Carregando padrões do universo via IA...</p>';

      window.openModal('modal-details');

      if (!node.attributes) node.attributes = {};

      // Pede para a IA descobrir os atributos padrão do universo caso ainda não tenham sido gerados
      const aiFields = await fetchAiUniverseFields(node.group);
      const allKeys = Array.from(new Set([...aiFields, ...Object.keys(node.attributes)]));

      container.innerHTML = '';
      allKeys.forEach(field => {
        const div = document.createElement('div');
        div.className = 'form-group';
        div.innerHTML = `
          <label>${field}</label>
          <input type="text" class="dyn-attr-input" data-key="${field}" value="${node.attributes[field] || ''}" placeholder="Descreva ${field.toLowerCase()}...">
        `;
        container.appendChild(div);
      });
    }

    window.addCustomAttribute = function() {
      const keyInput = document.getElementById('new-attr-key');
      const keyName = keyInput.value.trim();
      if (!keyName) return;

      const container = document.getElementById('dynamic-fields-container');
      const div = document.createElement('div');
      div.className = 'form-group';
      div.innerHTML = `
        <label>${keyName}</label>
        <input type="text" class="dyn-attr-input" data-key="${keyName}" value="" placeholder="Descreva ${keyName.toLowerCase()}...">
      `;
      container.appendChild(div);
      keyInput.value = '';
    }

    window.saveNodeDetails = function() {
      const id = parseInt(document.getElementById('details-id').value);
      const node = nodes.find(n => n.id === id);
      if (!node) return;

      node.notes = document.getElementById('details-notes').value.trim();
      node.attributes = {};

      const attrInputs = document.querySelectorAll('.dyn-attr-input');
      attrInputs.forEach(input => {
        const key = input.getAttribute('data-key');
        const val = input.value.trim();
        if (val) node.attributes[key] = val;
      });

      localStorage.setItem('c_nodes', JSON.stringify(nodes));
      window.closeModal('modal-details');
      alert('Ficha salva com sucesso!');
    }

    window.deleteNode = function() {
      const id = parseInt(document.getElementById('details-id').value);
      if (confirm('Deseja excluir este personagem?')) {
        nodes = nodes.filter(n => n.id !== id);
        localStorage.setItem('c_nodes', JSON.stringify(nodes));
        drawMap();
        window.closeModal('modal-details');
      }
    }

    window.saveSettings = function() {
      config.apiKey = document.getElementById('cfg-key').value.trim();
      config.model = document.getElementById('cfg-model').value.trim() || 'gemini-2.5-flash';
      config.userName = document.getElementById('cfg-user').value.trim() || 'André';
      config.aiName = document.getElementById('cfg-ai').value.trim() || 'Astra';

      localStorage.setItem('c_key', config.apiKey);
      localStorage.setItem('c_model', config.model);
      localStorage.setItem('c_user', config.userName);
      localStorage.setItem('c_ai', config.aiName);

      document.getElementById('chat-title').innerText = `💬 ${config.aiName}`;
      window.closeModal('modal-settings');
      alert('Configurações salvas!');
    }

    window.createNode = function() {
      const nameInput = document.getElementById('node-name');
      const groupInput = document.getElementById('node-group');
      const name = nameInput.value.trim();
      const group = groupInput.value.trim() || 'Geral';
      
      if (!name) return;

      const newNode = {
        id: Date.now(),
        name: name,
        group: group,
        x: canvas.width / 2 + (Math.random() * 100 - 50),
        y: canvas.height / 2 + (Math.random() * 100 - 50),
        attributes: {},
        notes: ''
      };

      nodes.push(newNode);
      localStorage.setItem('c_nodes', JSON.stringify(nodes));
      drawMap();
      
      nameInput.value = '';
      groupInput.value = '';
      window.closeModal('modal-node');
      window.openDetailsModal(newNode);
    }

    window.toggleChat = function() {
      const drawer = document.getElementById('chat-drawer');
      drawer.classList.toggle('hidden');
    }

    function renderChat() {
      const box = document.getElementById('chat-box');
      box.innerHTML = '';
      chatHistory.forEach(msg => {
        const div = document.createElement('div');
        div.className = `chat-msg ${msg.role}`;
        div.innerHTML = `<strong>${msg.role === 'user' ? config.userName : config.aiName}:</strong> ${msg.text}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    window.sendChatMessage = async function() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      if (!config.apiKey) {
        alert('Adicione sua Chave de API nas configurações (⚙️).');
        window.openModal('modal-settings');
        return;
      }

      chatHistory.push({ role: 'user', text: text });
      input.value = '';
      chatHistory.push({ role: 'ai', text: '<i>Pensando...</i>' });
      renderChat();

      try {
        const activeModel = config.model || 'gemini-2.5-flash';
        const cleanKey = encodeURIComponent(config.apiKey);
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${cleanKey}`;

        const loreContext = nodes.map(n => {
          let attrText = '';
          if (n.attributes && Object.keys(n.attributes).length > 0) {
            attrText = Object.entries(n.attributes).map(([k, v]) => `${k}: ${v}`).join(', ');
          }
          return `- ${n.name} (Universo: ${n.group})${attrText ? ' [' + attrText + ']' : ''}${n.notes ? ' (Nota: ' + n.notes + ')' : ''}`;
        }).join('\n');

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Você é ${config.aiName}, assistente de lore e OCs de ${config.userName}.\n\nPersonagens e Atributos Cadastrados:\n${loreContext}\n\nResponda à mensagem considerando rigorosamente esses universos e atributos: ${text}`
              }]
            }]
          })
        });

        chatHistory.pop();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sem resposta.';
        
        chatHistory.push({ role: 'ai', text: reply });
        localStorage.setItem('c_chat', JSON.stringify(chatHistory));
        renderChat();
      } catch (err) {
        if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].text === '<i>Pensando...</i>') {
          chatHistory.pop();
        }
        chatHistory.push({ role: 'ai', text: 'Erro: ' + err.message });
        renderChat();
      }
    }

    window.onload = () => {
      document.getElementById('chat-title').innerText = `💬 ${config.aiName}`;
      resizeCanvas();
      renderChat();
    };
  </script>
</body>
</html>
